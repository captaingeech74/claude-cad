# fly.toml - Fly.io deployment configuration for CAD Screener backend
# Deploy with: fly deploy (from the backend/ directory)

app = "cad-screener"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DISPLAY = ":99"
  LIBGL_ALWAYS_SOFTWARE = "1"
  GALLIUM_DRIVER = "llvmpipe"

[http_service]
  internal_port = 6080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9091
  path = "/metrics"
