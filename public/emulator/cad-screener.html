<!doctype html>
<html lang="en-us">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CAD Colour Vision Screener</title>
    <meta name="description" content="CAD Colour Vision Screener running via Boxedwine emulator">
    <link rel="stylesheet" type="text/css" href="boxedwine.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #ffffff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #loading .status-text {
        font-size: 18px;
        margin-top: 20px;
        color: #818CF8;
      }
      #loading .sub-text {
        font-size: 14px;
        margin-top: 8px;
        color: #9CA3AF;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(129, 140, 248, 0.2);
        border-top: 4px solid #818CF8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      progress {
        width: 300px;
        height: 8px;
        margin-top: 16px;
        border-radius: 4px;
        appearance: none;
        -webkit-appearance: none;
      }
      progress::-webkit-progress-bar {
        background: rgba(129, 140, 248, 0.1);
        border-radius: 4px;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #4F46E5, #7C3AED);
        border-radius: 4px;
      }
      #inline {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #inline .emscripten {
        padding: 4px 8px;
        background: #111827;
        color: #9CA3AF;
        font-size: 12px;
        font-family: monospace;
      }
      #dropzone {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .emscripten_border {
        border: none;
      }
      #canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 40px);
      }
      #output {
        display: none !important;
      }
      .modalDialog, #uploadbtn, #downloadbtn, #sound-checkbox {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="status-text" id="status">Preparing your test environment...</div>
      <div class="sub-text">This may take a moment on first load</div>
      <progress value="0" max="100" id="progress"></progress>
    </div>

    <div id="inline" style="display: none;">
      <div class="emscripten">
        <button id="startbtn" style="display: none" onclick="start()">Start</button>
        <button id="uploadbtn" style="display: none">Add File(s)</button>
        <input style="display: none" id="upload" type="file" multiple />
        <button id="downloadbtn" style="display: none">Get File(s)</button>
        <a style="display: none" id="modalLink" href="#openModal">Open</a>
        <a style="display: none" id="modalLinkExe" href="#openModalExe">Open</a>
        <span id="sound-checkbox" style="display: none">
          <input type="checkbox" id="soundToggle">Enable Sound</input>
        </span>
        <input type="checkbox" id="pointerLock" style="display:none;">
        <input type="checkbox" id="showConsole" style="display:none;">
        <input type="checkbox" id="resize" checked style="display:none;">
        <input type="button" value="Fullscreen" onclick="Module.requestFullScreen(false, true)" style="background:#4F46E5;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;">
      </div>
      <div id="dropzone">
        <div class="emscripten_border">
          <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
        </div>
      </div>
      <textarea class="emscripten" id="output" rows="8" style="display:none"></textarea>
    </div>

    <div id="openModal" class="modalDialog">
      <div>
        <a href="#close" title="Close" class="close">X</a>
        <div><h3>Get File(s)</h3><input id="selectedItem" type="text" size="50" readonly><button onclick="extract();">Get</button></div>
        <div id="tree"></div>
        <div><h3 id="loadStatus">Loading...</h3></div>
      </div>
    </div>
    <div id="openModalExe" class="modalDialog">
      <div>
        <a id="openModalExeClick" href="#close" title="Close" class="close">X</a>
        <div><h3>Execute</h3><div id="message"></div><div id="items"></div></div>
      </div>
    </div>

    <script type="text/javascript" src="browserfs.min.js"></script>
    <script type="text/javascript" src="jszip.min.js"></script>
    <script type="text/javascript" src="boxedwine-shell.js"></script>
    <script>
      // Override default configuration for CAD Screener
      DEFAULT_AUTO_RUN = true;
      DEFAULT_SOUND_ENABLED = false;
      ALLOW_PARAM_OVERRIDE_FROM_URL = true;

      // Post message to parent when emulator state changes
      function notifyParent(state, detail) {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'boxedwine-status', state: state, detail: detail }, '*');
        }
      }

      // Override status display to also notify parent
      var originalSetStatus = Module ? Module.setStatus : null;
      window.addEventListener('load', function() {
        var statusEl = document.getElementById('status');
        var progressEl = document.getElementById('progress');

        if (typeof Module !== 'undefined' && Module.setStatus) {
          var origSetStatus = Module.setStatus;
          Module.setStatus = function(text) {
            origSetStatus.call(Module, text);
            if (statusEl) statusEl.textContent = text || 'Loading...';

            var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
            if (m && progressEl) {
              var pct = (parseInt(m[2]) / parseInt(m[4])) * 100;
              progressEl.value = pct;
            }

            if (text === '') {
              notifyParent('running', 'CAD Screener is running');
            }
          };
        }
      });
    </script>
    <script async type="text/javascript" src="boxedwine.js"></script>
  </body>
</html>
